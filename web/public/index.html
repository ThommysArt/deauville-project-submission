<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deauville Festival du Rire 2027</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <p class="dates" id="fest-dates"></p>
    <h1 id="fest-name">Deauville Festival du Rire</h1>
  </header>
  <main>
    <section id="now" hidden>
      <h2>On stage now</h2>
      <ul id="now-playing"></ul>
      <h3>Up next</h3>
      <ul id="up-next"></ul>
    </section>
    <section>
      <h2>Programme</h2>
      <nav id="days" aria-label="Days"></nav>
      <p>
        <label for="venue-filter">Venue</label>
        <select id="venue-filter">
          <option value="">All venues</option>
        </select>
      </p>
      <div id="programme"></div>
    </section>
    <section>
      <h2>Venues</h2>
      <ul id="venues"></ul>
    </section>
    <section>
      <h2>Artists</h2>
      <div id="artists"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
